<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Partially assembled wooden desk organizer</title>
  <desc id="desc">Illustrative example workspace, not a photograph or live camera image. A pale wooden organizer rests on a sage cutting mat with loose dividers to its right, hardware to its lower left, a glue bottle, pencil, and paper clips.</desc>
  <metadata>Threadback illustrative example. Editable code-native vector artwork. Nominal object centers in viewBox coordinates: organizer base 577.5,419; loose divider pair 876,442; hardware 291,521; glue 1011,251.</metadata>
