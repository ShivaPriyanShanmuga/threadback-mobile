    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7e6c7"/><stop offset="1" stop-color="#d7b17c"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c29863"/><stop offset=".5" stop-color="#deba87"/><stop offset="1" stop-color="#b98b57"/></linearGradient>
