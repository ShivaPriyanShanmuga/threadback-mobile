name: Check Threadback
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
  private-cloudflare:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deployments/cloudflare/package-lock.json
      - run: npm ci --prefix deployments/cloudflare
      - run: npm test --prefix deployments/cloudflare
      - run: npm run build --prefix deployments/cloudflare
